<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800" role="img" aria-hidden="true">
  <defs>
    <radialGradient id="glow" cx="50%" cy="48%" r="58%">
      <stop offset="0%" stop-color="#163038"/>
      <stop offset="55%" stop-color="#101820"/>
      <stop offset="100%" stop-color="#0b0f14"/>
    </radialGradient>
  </defs>
  <style>
    .packet { stroke-dasharray: 40 1720; animation: travel 10s linear infinite; }
    .halo { animation: pulse 7s ease-in-out infinite; }
    @keyframes travel { to { stroke-dashoffset: -1760; } }
    @keyframes pulse { 0%, 100% { opacity: 0.35; } 50% { opacity: 0.8; } }
    @media (prefers-reduced-motion: reduce) {
      .packet, .halo { animation: none; }
    }
  </style>
  <rect width="800" height="800" fill="url(#glow)"/>
  <line x1="400" y1="56" x2="400" y2="744" stroke="#4ae8f0" stroke-opacity="0.16" stroke-width="1"/>
  <line x1="56" y1="400" x2="744" y2="400" stroke="#4ae8f0" stroke-opacity="0.12" stroke-width="1"/>
  <circle cx="400" cy="400" r="318" fill="none" stroke="#4ae8f0" stroke-opacity="0.14" stroke-width="1"/>
  <circle class="halo" cx="400" cy="400" r="274" fill="none" stroke="#4ae8f0" stroke-opacity="0.4" stroke-width="1.25"/>
  <circle cx="400" cy="400" r="274" fill="none" stroke="#4ae8f0" stroke-opacity="0.78" stroke-width="1.7"/>
  <circle class="packet" cx="400" cy="400" r="274" fill="none" stroke="#f2ffff" stroke-width="2.2"/>
  <circle cx="400" cy="400" r="6.5" fill="#d4a05a"/>
</svg>
