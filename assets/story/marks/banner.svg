<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800" role="img" aria-hidden="true">
  <defs>
    <radialGradient id="glow" cx="50%" cy="48%" r="58%">
      <stop offset="0%" stop-color="#1c424c"/>
      <stop offset="38%" stop-color="#13242c"/>
      <stop offset="100%" stop-color="#0b0f14"/>
    </radialGradient>
    <radialGradient id="disc" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4ae8f0" stop-opacity="0.10"/>
      <stop offset="62%" stop-color="#4ae8f0" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#4ae8f0" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <style>
    .packet { stroke-dasharray: 56 1704; animation: travel 10s linear infinite; }
    .halo { animation: pulse 7s ease-in-out infinite; }
    @keyframes travel { to { stroke-dashoffset: -1760; } }
    @keyframes pulse { 0%, 100% { opacity: 0.45; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      .packet, .halo { animation: none; }
    }
  </style>
  <rect width="800" height="800" fill="url(#glow)"/>
  <circle cx="400" cy="400" r="290" fill="url(#disc)"/>
  <line x1="400" y1="36" x2="400" y2="764" stroke="#4ae8f0" stroke-opacity="0.28" stroke-width="1.25"/>
  <line x1="36" y1="400" x2="764" y2="400" stroke="#4ae8f0" stroke-opacity="0.2" stroke-width="1.25"/>
  <circle cx="400" cy="400" r="328" fill="none" stroke="#4ae8f0" stroke-opacity="0.22" stroke-width="1.5"/>
  <circle class="halo" cx="400" cy="400" r="276" fill="none" stroke="#4ae8f0" stroke-opacity="0.55" stroke-width="14" filter="url(#soft)"/>
  <circle cx="400" cy="400" r="276" fill="none" stroke="#4ae8f0" stroke-opacity="1" stroke-width="5"/>
  <circle class="packet" cx="400" cy="400" r="276" fill="none" stroke="#f2ffff" stroke-width="7"/>
  <circle cx="400" cy="400" r="13" fill="#d4a05a"/>
</svg>
