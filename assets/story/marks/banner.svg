<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1200" viewBox="0 0 800 1200" role="img" aria-hidden="true">
  <defs>
    <radialGradient id="glow" cx="50%" cy="42%" r="58%">
      <stop offset="0%" stop-color="#163038"/>
      <stop offset="55%" stop-color="#101820"/>
      <stop offset="100%" stop-color="#0b0f14"/>
    </radialGradient>
  </defs>
  <style>
    .packet { stroke-dasharray: 26 552; animation: travel 10s linear infinite; }
    .halo { animation: pulse 7s ease-in-out infinite; }
    @keyframes travel { to { stroke-dashoffset: -578; } }
    @keyframes pulse { 0%, 100% { opacity: 0.4; } 50% { opacity: 0.85; } }
    @media (prefers-reduced-motion: reduce) {
      .packet, .halo { animation: none; }
    }
  </style>
  <rect width="800" height="1200" fill="url(#glow)"/>
  <line x1="400" y1="180" x2="400" y2="980" stroke="#4ae8f0" stroke-opacity="0.22" stroke-width="1"/>
  <circle class="halo" cx="400" cy="400" r="92" fill="none" stroke="#4ae8f0" stroke-opacity="0.38" stroke-width="1"/>
  <circle class="packet" cx="400" cy="400" r="92" fill="none" stroke="#f2ffff" stroke-width="1.6"/>
  <circle cx="400" cy="400" r="4" fill="#d4a05a"/>
  <rect x="268" y="620" width="264" height="1" fill="#d4a05a" fill-opacity="0.42"/>
</svg>
