<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800" role="img" aria-hidden="true">
  <defs>
    <radialGradient id="glow" cx="50%" cy="48%" r="58%">
      <stop offset="0%" stop-color="#163038"/>
      <stop offset="38%" stop-color="#111c24"/>
      <stop offset="100%" stop-color="#0b0f14"/>
    </radialGradient>
    <radialGradient id="disc" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4ae8f0" stop-opacity="0.08"/>
      <stop offset="62%" stop-color="#4ae8f0" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#4ae8f0" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-24%" y="-24%" width="148%" height="148%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <style>
    /* Packet is frozen on the hero — only a slow ambient breath remains. */
    .packet { stroke-dasharray: 36 1724; opacity: 0.22; }
    .halo { animation: breath 22s ease-in-out infinite; }
    @keyframes breath { 0%, 100% { opacity: 0.26; } 50% { opacity: 0.44; } }
    @media (prefers-reduced-motion: reduce) {
      .halo { animation: none; }
    }
  </style>
  <rect width="800" height="800" fill="url(#glow)"/>
  <circle cx="400" cy="400" r="290" fill="url(#disc)"/>
  <line x1="400" y1="36" x2="400" y2="764" stroke="#4ae8f0" stroke-opacity="0.12" stroke-width="1.25"/>
  <line x1="36" y1="400" x2="764" y2="400" stroke="#4ae8f0" stroke-opacity="0.09" stroke-width="1.25"/>
  <circle cx="400" cy="400" r="328" fill="none" stroke="#4ae8f0" stroke-opacity="0.12" stroke-width="1.5"/>
  <circle class="halo" cx="400" cy="400" r="276" fill="none" stroke="#4ae8f0" stroke-opacity="0.55" stroke-width="28" filter="url(#soft)"/>
  <circle cx="400" cy="400" r="276" fill="none" stroke="#4ae8f0" stroke-opacity="0.82" stroke-width="10"/>
  <circle class="packet" cx="400" cy="400" r="276" fill="none" stroke="#f2ffff" stroke-width="3.5"/>
  <circle cx="400" cy="400" r="12" fill="#d4a05a" fill-opacity="0.62"/>
</svg>
